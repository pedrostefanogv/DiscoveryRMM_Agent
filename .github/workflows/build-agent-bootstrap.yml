name: Build Agent Bootstrap Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versao opcional para embed no binario/instalador (ex. 1.2.3)
        required: false
        default: ""
      payload_url:
        description: URL do instalador de segunda etapa
        required: true
        type: string
      payload_sha256:
        description: SHA256 do payload (opcional)
        required: false
        default: ""
      payload_filename:
        description: Nome do payload salvo localmente
        required: false
        default: discovery-stage2-installer.exe
      output_name:
        description: Nome do bootstrap de saida
        required: false
        default: discovery-agent-bootstrap.exe
      auto_provisioning:
        description: Habilitar auto-provisioning (zero-touch via P2P) por padrao (0 ou 1)
        required: false
        default: "1"
      generic_install:
        description: Gerar bootstrap generico para auto provisioning P2P
        required: false
        type: boolean
        default: false

jobs:
  build-bootstrap:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GOWORK: off

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build bootstrap installer
        shell: pwsh
        # M20: inputs do workflow_dispatch interpolados via env (NUNCA direto no
        # run — "${{ inputs.x }}" permite command injection pelo formulário).
        env:
          WF_PAYLOAD_URL: "${{ github.event.inputs.payload_url }}"
          WF_VERSION: "${{ github.event.inputs.version }}"
          WF_PAYLOAD_SHA256: "${{ github.event.inputs.payload_sha256 }}"
          WF_PAYLOAD_FILENAME: "${{ github.event.inputs.payload_filename }}"
          WF_OUTPUT_NAME: "${{ github.event.inputs.output_name }}"
          WF_AUTO_PROVISIONING: "${{ github.event.inputs.auto_provisioning }}"
          WF_GENERIC_INSTALL: "${{ github.event.inputs.generic_install }}"
        run: |
          $params = @{
            ProjectRoot = $PWD
            PayloadUrl = $env:WF_PAYLOAD_URL
            Version = $env:WF_VERSION
            PayloadSha256 = $env:WF_PAYLOAD_SHA256
            PayloadFileName = $env:WF_PAYLOAD_FILENAME
            OutputName = $env:WF_OUTPUT_NAME
            AutoProvisioning = $env:WF_AUTO_PROVISIONING
          }

          if ($env:WF_GENERIC_INSTALL -eq 'true') {
            $params.GenericInstall = $true
          }

          .\build\scripts\build-bootstrap-installer.ps1 @params

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovery-agent-bootstrap
          path: src/build/bin/*.exe
