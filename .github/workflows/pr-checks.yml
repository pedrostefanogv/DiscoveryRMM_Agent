name: PR Checks

# Executa SOMENTE ao abrir/atualizar PRs direcionados a beta, release ou lts.
# Nao roda em pushes diretos de branches de feature.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - beta
      - release
      - lts

# Cancela execucoes anteriores do mesmo PR para evitar filas duplicadas.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build & Vet
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GOWORK: off

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # O pacote main depende de Wails + CGO + frontend embedded — excluir da verificacao.
      # Verifica apenas os subpacotes de logica de negocio.
      # NOTA (auditoria 2026-10-21): "./internal/..." apontava para um diretorio que
      # nao existe em src/ — o Go emite apenas um warning e o job ficava verde.
      - name: go vet
        working-directory: src
        shell: pwsh
        run: go vet ./app/...

      # Falha o PR se houver arquivo .go fora do formato (regressao de gofmt).
      - name: gofmt check
        working-directory: src
        shell: pwsh
        run: |
          $out = gofmt -l . 2>$null
          if ($out) { Write-Host $out; Write-Error "arquivos fora do gofmt: $out"; exit 1 }

  test:
    name: Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GOWORK: off

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # -race: detecta corridas reais (hotspots: remotesession, support chat, watchdog).
      # No windows-latest o GCC (mingw) ja esta presente, atendendo ao requisito de CGO.
      - name: go test (race)
        working-directory: src
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: go test -race ./app/... -timeout 300s
