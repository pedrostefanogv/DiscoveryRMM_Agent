<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Discovery</title>
  <!-- B13 (atualizado na correcao do R7): continua SEM preconnect e SEM link para
       fonts.googleapis.com/fonts.gstatic.com - o agente NAO faz requisicao externa
       de fonte. O que mudou: a unica fonte que o agente precisava (Material
       Symbols Rounded, para os icones do A2UI) passou a ser EMPACOTADA
       LOCALMENTE em assets/fonts/ e declarada por @font-face em
       styles/icon-font.css (importado por styles.css). Ela e servida pela
       propria origem do app (//go:embed all:frontend em main.go) e funciona
       100% offline. Historico: antes, B13 removeu o Google Fonts e o icone do
       A2UI virou texto (R7); agora a fonte e local e o icone renderiza. -->
  <link rel="stylesheet" href="styles.css" />
  <!-- Estilos da aba embutida do chat de suporte (bolhas, statusbar, composer,
       modais e comentários do chamado). Sem este link a view perdia TODAS as
       classes .sc-* e as mensagens saíam como texto puro, sem destaque. -->
  <link rel="stylesheet" href="support-chat.css" />
  <!-- Painel de sensores do agente (aba Debug). Folha dedicada porque as
       classes .debug-sensors-* / .sensor-* nao tinham estilo nenhum e o
       painel saia como HTML cru, com rotulo e valor colados. Carregada
       DEPOIS de styles.css de proposito: vence empates de especificidade
       com as parciais de responsivo (que trazem .debug-panel). -->
  <link rel="stylesheet" href="styles/debug-sensors.css" />
</head>

<body>
  <div class="window-chrome" id="windowChrome">
    <div class="window-chrome-drag">
      <div class="window-chrome-meta" id="windowChromeMeta">
        <span id="windowMetaPC" class="window-meta-pc">
          <span id="windowMetaDot" class="window-meta-dot"></span>
          <span id="windowMetaPCName">PC: —</span>
        </span>
      </div>
    </div>
    <div class="window-chrome-actions">
      <button id="windowMaxBtn" class="window-chrome-btn" title="Maximizar/Restaurar"
        aria-label="Maximizar ou restaurar" data-i18n-title="action.maximizeRestore">
        <svg viewBox="0 -960 960 960" width="12" height="12" fill="none" aria-hidden="true" focusable="false">
          <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z" fill="currentColor" />
        </svg>
      </button>
      <button id="windowCloseBtn" class="window-chrome-btn close" title="Fechar para tray" aria-label="Fechar para tray"
        data-i18n-title="action.closeToTray">
        <svg viewBox="0 -960 960 960" width="12" height="12" fill="none" aria-hidden="true" focusable="false">
          <path d="M480-424 284-228q-11 11-28 11t-28-11q-11-11-11-28t11-28l196-196-196-196q-11-11-11-28t11-28q11-11 28-11t28 11l196 196 196-196q11-11 28-11t28 11q11 11 11 28t-11 28L536-480l196 196q11 11 11 28t-11 28q-11 11-28 11t-28-11L480-424Z" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <div class="app-shell" id="appShell">
    <div id="sidebarMount"></div>
    <div id="mainMount"></div>
  </div>

  <!-- Wails v3 bridge: expõe os bindings nativos v3 sob window.go.app.App e
       o runtime v3 estruturado sob window.wails. Deve carregar ANTES do bootstrap-partials.js. -->
  <script type="module" src="wails-bridge.js"></script>
  <!-- Normalizacao dos nomes de glifo do componente Icon do A2UI (R7): o
       catálogo manda camelCase ("arrowBack") e a ligadura da fonte e snake_case
       ("arrow_back"); 4 nomes nem existem como ligadura. Precisa estar
       disponivel ANTES de app-chat.js rodar (script classico, sem modulo). -->
  <script src="js/a2ui-icon-names.js"></script>
  <script src="js/bootstrap-partials.js"></script>
</body>

</html>
