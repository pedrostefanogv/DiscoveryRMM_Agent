<main id="knowledgeView" class="page-content hidden" role="tabpanel" aria-labelledby="tabKnowledge">
    <section class="knowledge-panel">
      <div class="statusbar page-bar">
        <div>
          <strong data-i18n="knowledge.title">Base de Conhecimento</strong>
          <div class="meta" data-i18n="knowledge.subtitle">Artigos de manutencao e troubleshooting de PCs</div>
        </div>
        <button id="kbRefreshBtn" class="btn subtle" type="button" title="Atualizar base de conhecimento" aria-label="Atualizar base de conhecimento" data-i18n-title="knowledge.refresh" data-i18n-aria-label="knowledge.refresh">&#x21bb;</button>
        <input id="kbSearchInput" type="search" class="kb-search-input" placeholder="Buscar por titulo, categoria, tag ou conteudo" data-i18n-placeholder="knowledge.searchPlaceholder" />
      </div>

      <div id="kbListView" class="kb-list-view">
        <div id="kbArticlesList" class="kb-articles-grid">
          <div class="meta" data-i18n="knowledge.loadingArticles">Carregando artigos...</div>
        </div>
      </div>

      <div id="kbDetailView" class="kb-detail-view hidden">
        <button id="kbBackBtn" class="btn subtle kb-detail-back" type="button" data-i18n="action.back">&#x2190; Voltar</button>
        <article id="kbArticleDetail" class="kb-article-detail">
          <h2 id="kbDetailTitle"></h2>
          <div id="kbDetailMeta" class="kb-detail-meta"></div>
          <div id="kbDetailContent" class="kb-detail-content"></div>
        </article>
      </div>
    </section>
  </main>
