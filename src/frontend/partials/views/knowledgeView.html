<main id="knowledgeView" class="page-content hidden" role="tabpanel" aria-labelledby="tabKnowledge">
  <section class="knowledge-panel">
    <div id="kbStatusBar" class="statusbar page-bar">
      <div>
        <strong data-i18n="knowledge.title">Base de Conhecimento</strong>
        <div class="meta" data-i18n="knowledge.subtitle">Artigos de manutenção e troubleshooting de PCs</div>
      </div>
      <button id="kbRefreshBtn" class="btn subtle" type="button" title="Atualizar base de conhecimento"
        aria-label="Atualizar base de conhecimento" data-i18n-title="knowledge.refresh"
        data-i18n-aria-label="knowledge.refresh"><svg viewBox="0 -960 960 960" width="16" height="16" aria-hidden="true" focusable="false"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-70q0-17 11.5-28.5T760-800q17 0 28.5 11.5T800-760v200q0 17-11.5 28.5T760-520H560q-17 0-28.5-11.5T520-560q0-17 11.5-28.5T560-600h128q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q68 0 124.5-34.5T692-367q8-14 22.5-19.5t29.5-.5q16 5 23 21t-1 30q-41 80-117 128t-169 48Z" fill="currentColor" /></svg></button>
      <input id="kbSearchInput" type="search" class="kb-search-input"
        placeholder="Buscar por título, categoria, tag ou conteúdo"
        data-i18n-placeholder="knowledge.searchPlaceholder" />
    </div>

    <div id="kbListView" class="kb-list-view">
      <div id="kbStaleBanner" class="cache-stale-banner hidden" data-i18n="knowledge.staleCache"></div>
      <div id="kbCategoryBar" class="kb-category-bar hidden" role="group" aria-label="Filtrar por categoria"></div>
      <div id="kbArticlesList" class="kb-articles-grid">
        <div class="meta" data-i18n="knowledge.loadingArticles">Carregando artigos...</div>
      </div>
    </div>

    <div id="kbDetailView" class="kb-detail-view hidden">
      <button id="kbBackBtn" class="btn subtle kb-detail-back" type="button" data-i18n="action.back">&#x2190;
        Voltar</button>
      <article id="kbArticleDetail" class="kb-article-detail">
        <h2 id="kbDetailTitle"></h2>
        <div id="kbDetailMeta" class="kb-detail-meta"></div>
        <nav id="kbPagesNav" class="kb-pages-nav hidden" aria-label="Páginas do artigo"></nav>
        <div id="kbDetailContent" class="kb-detail-content"></div>
        <div id="kbPagePager" class="kb-page-pager hidden"></div>
      </article>
    </div>
  </section>
</main>
