<main id="supportChatView" class="page-content hidden" role="tabpanel" aria-labelledby="tabSupportChat">
  <section class="chat-panel support-chat-panel">
    <div class="statusbar page-bar chat-statusbar">
      <span class="meta" id="scSubtitle">Conectando…</span>
      <span id="scStatusChip" class="sc-chip">aguardando</span>
      <span id="scTechnician" class="sc-technician-inline" hidden></span>
      <div class="actions">
        <button id="scEndBtn" type="button" class="btn subtle" title="Encerrar o chat">Encerrar</button>
      </div>
    </div>

    <div id="scBanner" class="cache-stale-banner" role="status" aria-live="polite" hidden></div>

    <div id="scMessages" class="chat-messages support-chat-messages" aria-live="polite">
      <div id="scEmpty" class="sc-empty">Aguardando o início da conversa…</div>
    </div>

    <div id="scPending" class="sc-pending" hidden></div>

    <section id="scComments" class="sc-comments" hidden>
      <button id="scCommentsToggle" type="button" class="sc-comments-toggle" aria-expanded="false"
        aria-controls="scCommentsList">
        <svg class="sc-comments-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 6 15 12 9 18" />
        </svg>
        <span class="sc-comments-title">Comentários do chamado</span>
        <span id="scCommentsCount" class="sc-comments-count"></span>
      </button>
      <div id="scCommentsList" class="sc-comments-list" hidden></div>
    </section>

    <!-- Conversa encerrada: o composer sai de cena (não fica um campo que
         parece ativo e não envia nada) e esta faixa assume o rodapé, mantendo
         o histórico em leitura. -->
    <div id="scEndedNotice" class="sc-ended" hidden>
      <div class="sc-ended-text">
        <strong>Conversa encerrada</strong>
        <span>O histórico continua disponível para leitura.</span>
      </div>
      <div class="sc-ended-actions">
        <button id="scEndedSupport" type="button" class="btn subtle">Ir para Suporte</button>
        <button id="scEndedClose" type="button" class="btn subtle">Fechar</button>
      </div>
    </div>

    <div id="scComposer" class="support-chat-composer">
      <div class="chat-input-wrap">
        <textarea id="scInput" class="chat-input" rows="2"
          placeholder="Escreva uma mensagem… (Enter envia, Shift+Enter quebra linha)"></textarea>
        <div class="chat-input-actions">
        <input id="scFileInput" type="file" multiple hidden />
        <button id="scAttachBtn" type="button" class="chat-icon-btn" title="Anexar arquivo (ou cole um print com Ctrl+V)"
          aria-label="Anexar arquivo">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
          </svg>
        </button>
        <button id="scShotBtn" type="button" class="chat-icon-btn chat-screenshot-btn"
          title="Capturar tela (escolher janela/região e anotar)" aria-label="Capturar tela">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8V6a2 2 0 0 1 2-2h2" />
            <path d="M16 4h2a2 2 0 0 1 2 2v2" />
            <path d="M20 16v2a2 2 0 0 1-2 2h-2" />
            <path d="M8 20H6a2 2 0 0 1-2-2v-2" />
            <circle cx="12" cy="12" r="3.5" />
          </svg>
        </button>
        <button id="scSendBtn" type="button" class="chat-icon-btn chat-send-btn" title="Enviar (Enter)"
          aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z" />
            <path d="M22 2 11 13" />
          </svg>
        </button>
        </div>
      </div>
    </div>
  </section>
<div id="scConfirm" class="sc-modal-overlay" hidden>
    <div class="sc-modal" role="dialog" aria-modal="true" aria-labelledby="scConfirmTitle">
      <h3 id="scConfirmTitle">Encerrar o chat?</h3>
      <p id="scConfirmText">Encerrar fecha esta janela e avisa o suporte. O histórico da conversa fica disponível no chamado.</p>
      <div class="sc-modal-actions">
        <button id="scConfirmCancel" type="button" class="sc-btn sc-btn--ghost">Continuar conversando</button>
        <button id="scConfirmOk" type="button" class="sc-btn sc-btn--danger">Encerrar chat</button>
      </div>
    </div>
  </div>

  <!-- Visor do anexo de imagem: o print enviado pelo suporte abre DENTRO da
       janela (antes o clique só baixava o arquivo). Segue o mesmo padrão dos
       modais — começa oculto e depende da regra .sc-modal-overlay[hidden]. -->
  <div id="scAttachmentViewer" class="sc-modal-overlay sc-viewer" hidden>
    <button id="scViewerClose" type="button" class="sc-viewer-close" aria-label="Fechar imagem">&times;</button>
    <button id="scViewerSave" type="button" class="sc-viewer-save" title="Salvar imagem (Shift+clique para escolher onde salvar)">
      Salvar imagem
    </button>
    <img id="scViewerImage" class="sc-viewer-image" alt="" />
    <div id="scViewerCaption" class="sc-viewer-caption"></div>
  </div>
</main>
