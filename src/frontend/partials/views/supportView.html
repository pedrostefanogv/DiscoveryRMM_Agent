<main id="supportView" class="page-content hidden" role="tabpanel" aria-labelledby="tabSupport">
  <section class="support-panel">
    <div id="supportStatusBar" class="statusbar page-bar">
      <div>
        <strong data-i18n="support.title">Suporte</strong>
        <div class="meta" data-i18n="support.subtitle">Chamados vinculados a este agente</div>
      </div>
      <div class="actions">
        <button id="refreshTicketsBtn" class="btn subtle" data-i18n="action.refreshList">Atualizar Lista</button>
        <button id="newTicketBtn" class="btn primary" data-i18n="action.newTicket">+ Novo Chamado</button>
      </div>
    </div>

    <div id="supportAgentBanner" class="agent-ctx-banner hidden">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </svg>
      <span id="agentContextText" class="meta"></span>
    </div>
    <div id="agentContextError" class="agent-ctx-error hidden">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span id="agentContextErrorText" class="meta"></span>
    </div>

    <div id="supportListView" class="support-list-view">
      <div class="support-sec-header section-bar">
        <span class="meta" data-i18n="support.myTickets">Meus Chamados</span>
        <span id="ticketsLoading" class="tickets-loading hidden" data-i18n="common.loading">Carregando...</span>
      </div>
      <div id="supportTicketsList" class="support-tickets-list">
        <div class="meta" data-i18n="support.noTickets">Nenhum chamado.</div>
      </div>
    </div>

    <div id="supportDetailView" class="support-detail-view hidden">
      <div class="support-detail-header-row">
        <button id="backToListBtn" class="btn subtle kb-detail-back" type="button" data-i18n="action.back">&#x2190;
          Voltar</button>
        <button id="openCloseTicketBtn" class="btn danger" type="button" data-i18n="action.closeTicket">Fechar
          Chamado</button>
      </div>
      <div id="supportTicketDetail" class="support-form-card">
        <div class="ticket-detail-top">
          <span id="ticketDetailId" class="ticket-id-badge"></span>
          <span id="ticketDetailStatus" class="ticket-status-badge"></span>
          <span id="ticketDetailPriority" class="ticket-priority-badge"></span>
        </div>
        <h3 id="ticketDetailTitle" class="ticket-detail-title"></h3>
        <div id="ticketDetailMeta" class="ticket-detail-meta"></div>
        <div id="ticketDetailDesc" class="ticket-detail-desc"></div>

        <div class="comments-section">
          <h4 data-i18n="support.comments">Comentarios</h4>
          <div id="commentsList" class="comments-list">
            <div class="meta" data-i18n="common.loading">Carregando...</div>
          </div>
          <div class="comment-compose">
            <textarea id="commentInput" rows="3" placeholder="Escreva um comentario..."
              data-i18n-placeholder="support.writeCommentPlaceholder" data-app-lang="true"></textarea>
            <button id="submitCommentBtn" class="btn primary" data-i18n="action.sendComment">Enviar Comentario</button>
          </div>
        </div>
      </div>
    </div>

    <div id="closeTicketModal" class="close-ticket-modal hidden" role="dialog" aria-modal="true"
      aria-labelledby="closeTicketModalTitle">
      <div class="close-ticket-modal-card">
        <div class="close-ticket-modal-header">
          <h4 id="closeTicketModalTitle" data-i18n="support.closeTicketTitle">Fechar Chamado</h4>
          <button id="closeTicketModalCancelBtn" class="btn subtle btn-icon" type="button" aria-label="Fechar"
            title="Fechar">&times;</button>
        </div>
        <div id="ticketClosePanel" class="ticket-close-panel">
          <div class="form-field">
            <label data-i18n="field.rating">Avaliacao</label>
            <div id="closeTicketStars" class="stars-row">
              <button type="button" class="star-btn" data-value="1" aria-label="1 estrela" title="Muito ruim"><svg
                  viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></button>
              <button type="button" class="star-btn" data-value="2" aria-label="2 estrelas" title="Ruim"><svg
                  viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></button>
              <button type="button" class="star-btn" data-value="3" aria-label="3 estrelas" title="Regular"><svg
                  viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></button>
              <button type="button" class="star-btn" data-value="4" aria-label="4 estrelas" title="Bom"><svg
                  viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></button>
              <button type="button" class="star-btn" data-value="5" aria-label="5 estrelas" title="Excelente"><svg
                  viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></button>
            </div>
            <button type="button" id="clearRatingBtn" class="btn subtle btn-sm hidden" data-i18n="support.noRating">Sem
              avaliacao</button>
          </div>
          <div class="form-field">
            <label for="closeTicketWorkflowStateSelect" data-i18n="support.finalStateOptional">Estado final
              (opcional)</label>
            <select id="closeTicketWorkflowStateSelect">
              <option value="" data-i18n="support.closeWithDefaultState">Fechar com estado padrao</option>
            </select>
          </div>
          <div class="form-field">
            <label for="closeTicketComment" data-i18n="support.closingCommentOptional">Comentario de fechamento
              (opcional)</label>
            <textarea id="closeTicketComment" rows="3" placeholder="Descreva a solucao aplicada..."
              data-i18n-placeholder="support.describeAppliedSolution" data-app-lang="true"></textarea>
          </div>
          <div class="close-ticket-modal-actions">
            <button id="closeTicketModalCancelBottomBtn" class="btn subtle" type="button"
              data-i18n="action.cancel">Cancelar</button>
            <button id="closeTicketBtn" class="btn danger" data-i18n="action.closeTicket">Fechar Chamado</button>
          </div>
        </div>
      </div>
    </div>

    <div id="supportNewTicketView" class="support-new-ticket-view hidden">
      <button id="backFromNewBtn" class="btn subtle kb-detail-back" type="button" data-i18n="action.back">&#x2190;
        Voltar</button>
      <div class="support-form-card">
        <h3 id="supportCreateTitle" data-i18n="support.openTicketTitle">Abrir Chamado</h3>
        <form id="supportForm" class="support-form" autocomplete="off">
          <div class="form-field">
            <label for="ticketTitle" data-i18n="support.ticketTitle">Titulo *</label>
            <input id="ticketTitle" type="text" placeholder="Resumo do problema" required maxlength="200"
              data-i18n-placeholder="support.problemSummary" />
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="ticketCategory" data-i18n="field.category">Categoria</label>
              <select id="ticketCategory">
                <option value="" data-i18n="support.select">Selecione...</option>
                <option value="Hardware" data-i18n="support.category.hardware">Hardware</option>
                <option value="Software" data-i18n="support.category.software">Software</option>
                <option value="Rede" data-i18n="support.category.network">Rede</option>
                <option value="Acesso" data-i18n="support.category.access">Acesso / Permissoes</option>
                <option value="Email" data-i18n="support.category.email">E-mail</option>
                <option value="Impressora" data-i18n="support.category.printer">Impressora</option>
                <option value="VPN" data-i18n="support.category.vpn">VPN</option>
                <option value="Outro" data-i18n="support.category.other">Outro</option>
              </select>
            </div>
            <div class="form-field">
              <label for="ticketPriority" data-i18n="field.priority">Prioridade</label>
              <select id="ticketPriority">
                <option value="1" data-i18n="support.priority.low">Baixa</option>
                <option value="2" selected data-i18n="support.priority.medium">Media</option>
                <option value="3" data-i18n="support.priority.high">Alta</option>
                <option value="4" data-i18n="support.priority.critical">Critica</option>
              </select>
            </div>
          </div>
          <div class="form-field">
            <label for="ticketDescription" data-i18n="support.descriptionRequired">Descricao *</label>
            <textarea id="ticketDescription" rows="6" placeholder="Descreva o problema com detalhes..." required
              data-i18n-placeholder="support.describeProblemDetails" data-app-lang="true"></textarea>
          </div>
          <div id="ticketFormStatus" class="form-status hidden"></div>
          <button type="submit" id="submitTicketBtn" class="btn primary full" data-i18n="action.sendTicket">Enviar
            Chamado</button>
        </form>
      </div>
    </div>
  </section>
</main>
