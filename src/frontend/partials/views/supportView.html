    <!-- Anexos do chamado em modal: botao no topo do detalhe. Antes a lista do
         repositorio aparecia colada no rodape da conversa. -->
    <div id="ticketAttachmentsModal" class="close-ticket-modal hidden" role="dialog" aria-modal="true"
      aria-labelledby="ticketAttachmentsModalTitle">
      <div class="close-ticket-modal-card ticket-attachments-modal-card">
        <div class="close-ticket-modal-header">
          <h4 id="ticketAttachmentsModalTitle" data-i18n="support.ticketAttachments">Anexos do chamado</h4>
          <button id="ticketAttachmentsModalCloseBtn" class="btn subtle btn-icon" type="button" aria-label="Fechar"
            title="Fechar">&times;</button>
        </div>
        <div id="ticketAttachmentsModalList" class="ticket-attachments-modal-list">
          <div class="meta" data-i18n="common.loading">Carregando...</div>
        </div>
      </div>
    </div>

    <div id="supportNewTicketView" class="support-new-ticket-view hidden">
      <button id="backFromNewBtn" class="btn subtle kb-detail-back" type="button" data-i18n="action.back">&#x2190;
        Voltar</button>
      <div class="support-form-card">
        <h3 id="supportCreateTitle" data-i18n="support.openTicketTitle">Abrir Chamado</h3>
        <form id="supportForm" class="support-form" autocomplete="off">
          <div class="form-field">
            <label for="ticketDepartment"><span data-i18n="field.department">Departamento</span> *</label>
            <select id="ticketDepartment">
              <option value="" data-i18n="support.select">Selecione...</option>
            </select>
          </div>
          <!-- Abertura propriamente dita: só aparece depois que o departamento é
               escolhido. Os campos com opções (Categoria/Prioridade e futuros)
               vêm do servidor, por departamento (ver loadTicketDepartmentFormSchema). -->
          <div id="ticketOpenFields" class="ticket-open-fields hidden">
            <div id="ticketDepartmentFields" class="ticket-extra-fields hidden"></div>
            <div class="form-field">
              <label for="ticketTemplate" data-i18n="field.template">Modelo de chamado</label>
              <select id="ticketTemplate" disabled>
                <option value="" data-i18n="support.templateSelectDepartment">Selecione o departamento primeiro</option>
              </select>
            </div>
            <div id="ticketTemplateExtra" class="ticket-extra-fields hidden"></div>
            <div class="form-field">
              <label for="ticketTitle" data-i18n="support.ticketTitle">Titulo *</label>
              <input id="ticketTitle" type="text" placeholder="Resumo do problema" required maxlength="200"
                data-i18n-placeholder="support.problemSummary" />
            </div>
            <div id="ticketFormSchemaFields" class="form-row hidden"></div>
            <div class="form-field">
              <label for="ticketDescription" data-i18n="support.descriptionRequired">Descricao *</label>
              <textarea id="ticketDescription" rows="6" placeholder="Descreva o problema com detalhes..." required
                data-i18n-placeholder="support.describeProblemDetails" data-app-lang="true"></textarea>
            </div>
            <div class="comment-attach-toolbar">
              <input id="newTicketFileInput" type="file" multiple hidden />
              <button id="newTicketAttachBtn" type="button" class="chat-icon-btn" title="Anexar arquivo (ou cole um print com Ctrl+V)"
                aria-label="Anexar arquivo" data-i18n-title="support.attachFileHint" data-i18n-aria-label="support.attachFile">
                <svg viewBox="0 -960 960 960" width="15" height="15" fill="none" aria-hidden="true" focusable="false">
          <path d="M720-330q0 104-73 177T470-80q-104 0-177-73t-73-177v-370q0-75 52.5-127.5T400-880q75 0 127.5 52.5T580-700v350q0 46-32 78t-78 32q-46 0-78-32t-32-78v-330q0-17 11.5-28.5T400-720q17 0 28.5 11.5T440-680v330q0 13 8.5 21.5T470-320q13 0 21.5-8.5T500-350v-350q-1-42-29.5-71T400-800q-42 0-71 29t-29 71v370q-1 71 49 120.5T470-160q70 0 119-49.5T640-330v-350q0-17 11.5-28.5T680-720q17 0 28.5 11.5T720-680v350Z" fill="currentColor" />

              </button>

                <svg viewBox="0 -960 960 960" width="15" height="15" fill="none" aria-hidden="true" focusable="false">

        </svg>
              </button>
            </div>
            <div id="newTicketAttachments" class="chat-attachments hidden"></div>
            <div id="ticketFormStatus" class="form-status hidden"></div>
            <button type="submit" id="submitTicketBtn" class="btn primary full" data-i18n="action.sendTicket">Enviar
              Chamado</button>
          </div>
        </form>
      </div>
    </div>
  </section>
