<main id="storeView" class="page-content" role="tabpanel" aria-labelledby="tabStore">
  <section class="store-layout">
    <div class="store-toolbar">
      <div class="store-toolbar-left">
        <input id="searchInput" type="search" placeholder="Pesquisar aplicativo por nome, id ou publisher"
          data-i18n-placeholder="store.searchPlaceholder" />
        <span id="catalogInfo" class="store-catalog-info" data-i18n="common.loading">Carregando...</span>
      </div>
      <div class="actions">
        <button id="reloadBtn" class="btn subtle" title="Atualizar catalogo" aria-label="Atualizar catalogo"
          data-i18n-title="action.reloadCatalog" data-i18n-aria-label="action.reloadCatalog">
          <svg viewBox="0 -960 960 960" width="16" height="16" fill="none" aria-hidden="true" focusable="false">
          <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-70q0-17 11.5-28.5T760-800q17 0 28.5 11.5T800-760v200q0 17-11.5 28.5T760-520H560q-17 0-28.5-11.5T520-560q0-17 11.5-28.5T560-600h128q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q68 0 124.5-34.5T692-367q8-14 22.5-19.5t29.5-.5q16 5 23 21t-1 30q-41 80-117 128t-169 48Z" fill="currentColor" />
        </svg>
        </button>
        <button id="homeBtn" class="btn subtle" title="Inicio" aria-label="Voltar para o inicio da loja"
          data-i18n-title="action.home" data-i18n-aria-label="action.home" disabled>
          <svg viewBox="0 -960 960 960" width="16" height="16" fill="none" aria-hidden="true" focusable="false">
          <path d="M240-200h120v-200q0-17 11.5-28.5T400-440h160q17 0 28.5 11.5T600-400v200h120v-360L480-740 240-560v360Zm-80 0v-360q0-19 8.5-36t23.5-28l240-180q21-16 48-16t48 16l240 180q15 11 23.5 28t8.5 36v360q0 33-23.5 56.5T720-120H560q-17 0-28.5-11.5T520-160v-200h-80v200q0 17-11.5 28.5T400-120H240q-33 0-56.5-23.5T160-200Zm320-270Z" fill="currentColor" />
        </svg>
        </button>
      </div>
    </div>

    <section class="store-main">
      <div class="store-cards-wrap">
        <div id="cards" class="cards"></div>
      </div>

      <footer id="catalogPagination" class="catalog-pagination">
        <button id="catalogPrevBtn" class="btn subtle" disabled data-i18n="action.previous">Anterior</button>
        <span id="catalogPageInfo" class="meta" data-i18n="pagination.pageOne">Pagina 1</span>
        <button id="catalogNextBtn" class="btn subtle" disabled data-i18n="action.next">Proxima</button>
      </footer>
    </section>
  </section>

  <!-- App Detail Modal -->
  <div id="appDetailModal" class="app-detail-modal hidden" aria-hidden="true" role="dialog" aria-modal="true"
    aria-labelledby="appDetailModalTitle">
    <div class="app-detail-card">
      <div class="app-detail-header">
        <div class="app-detail-header-left">
          <div id="appDetailIcon" class="app-detail-icon-wrap"></div>
          <div>
            <div class="app-detail-title-row">
              <h2 id="appDetailModalTitle" class="app-detail-title"></h2>
              <span id="appDetailInstalledBadge" class="app-detail-installed-slot"></span>
              <span id="appDetailOriginBadge" class="app-detail-origin-slot"></span>
            </div>
            <div id="appDetailMeta" class="meta"></div>
          </div>
        </div>
        <button class="app-detail-close btn subtle" id="appDetailCloseBtn" aria-label="Fechar"
          data-i18n-aria-label="action.close" data-i18n-title="action.close">✕</button>
      </div>
      <div id="appDetailDescription" class="app-detail-description kb-reader-content"></div>
      <div class="app-detail-footer">
        <button id="appDetailActionBtn" class="btn primary" data-i18n="action.install">Instalar</button>
      </div>
    </div>
  </div>
</main>
