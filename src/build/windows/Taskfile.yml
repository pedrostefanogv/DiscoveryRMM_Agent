version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .
      - task: build:service
        vars:
          PRODUCTION:
            ref: .PRODUCTION
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # M25: injeta a versão/commit no buildinfo — sem isso o binário local
      # ficava com Version "0.0.0" e o self-update podia entrar em loop
      # (compara buildinfo.Version). Override via -a APP_VERSION=x.y.z.
      APP_VERSION: '{{.APP_VERSION | default "0.0.0-dev"}}'
      GIT_COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags "desktop,production" -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X discovery/app/core/buildinfo.Version={{.APP_VERSION}} -X discovery/app/core/buildinfo.Commit={{.GIT_COMMIT}}"{{else}}-buildvcs=false -gcflags=all="-l" -ldflags="-X discovery/app/core/buildinfo.Version={{.APP_VERSION}} -X discovery/app/core/buildinfo.Commit={{.GIT_COMMIT}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '1'
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:service:
    summary: Builds the Windows service binary (discovery-service.exe)
    # Binário do serviço (PLANO_SEPARACAO_SERVICO_UI.md, Fase B/D1): SEM syso
    # Wails, SEM frontend embedado, SEM manifest requireAdministrator (SCM
    # ignora requestedExecutionLevel, mas o build limpo evita linkar WebView2).
    # CGO_ENABLED=1 preservado (mesmos requisitos de runtime do core).
    cmds:
      - go build {{.SERVICE_FLAGS}} -o {{.BIN_DIR}}/discovery-service.exe ./cmd/discovery-service
    vars:
      # M25: o serviço também carrega versão/commit (diagnóstico e self-update).
      SERVICE_FLAGS: '{{if eq .PRODUCTION "true"}}-trimpath -buildvcs=false -ldflags="-w -s -X discovery/app/core/buildinfo.Version={{.APP_VERSION}} -X discovery/app/core/buildinfo.Commit={{.GIT_COMMIT}}"{{else}}-buildvcs=false{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '1'
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application into a `.exe` bundle
    cmds:
      - task: create:nsis:installer

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/installer
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/installer"
      - makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" -DARG_SERVICE_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/discovery-service.exe" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
