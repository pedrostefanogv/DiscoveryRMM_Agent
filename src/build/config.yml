# Configuração do projeto Discovery para Wails v3.
# Quando atualizar `info`, rode `wails3 task common:update:build-assets`.
version: '3'

info:
  companyName: "Discovery RMM"
  productName: "Discovery"
  productIdentifier: "com.discovery.app"
  description: "Solução de monitoramento, gerenciamento e suporte para ambientes Windows"
  copyright: "Copyright © 2026 Discovery RMM"
  comments: "Solução de monitoramento, gerenciamento e suporte para ambientes Windows"
  version: "1.1.1"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go mod tidy
      type: blocking
